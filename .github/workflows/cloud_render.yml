name: Maker Studio 16GB Cloud Render

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Render/setup mode"
        required: true
        default: "setup_check"
        type: choice
        options:
          - setup_check
          - smoke
          - t1_hq
          - remotion
          - hyperframes
          - earshot
          - real_sfx
          - master
          - ironman_edit
          - vfx_edit
          - aura_edit
          - zohair_edit
          - stylea_plan
          - style3_maverick
      job_b64:
        description: "Base64-encoded JSON job payload (not needed for setup_check)"
        required: false
        default: ""
      cache_key:
        description: "Project cache namespace; reuse it for corrections"
        required: false
        default: "stylea-default"

permissions:
  contents: read

concurrency:
  group: maker-studio-render-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout Maker Studio
        uses: actions/checkout@v4

      - name: Install FFmpeg + libass + system libs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libass9 libgl1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: studio/cloud/requirements-base.txt

      - name: Install Python Media + MediaPipe + Whisper Stack
        env:
          RENDER_MODE: ${{ inputs.mode }}
        run: |
          pip install --quiet --upgrade pip
          pip install --quiet -r studio/cloud/requirements-base.txt
          if [ "$RENDER_MODE" = "t1_hq" ] || [ "$RENDER_MODE" = "style3_maverick" ]; then
            pip install --quiet faster-whisper
          fi
          if [ "$RENDER_MODE" = "earshot" ] || [ "$RENDER_MODE" = "master" ]; then
            pip install --quiet soxr librosa pyloudnorm scikit-learn matplotlib transformers
            pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          fi
          if [ "$RENDER_MODE" = "ironman_edit" ] || [ "$RENDER_MODE" = "aura_edit" ] || [ "$RENDER_MODE" = "zohair_edit" ] || [ "$RENDER_MODE" = "stylea_plan" ]; then
            pip install --quiet torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          fi

      - name: Set up Node.js + Remotion Dependencies (only when mode == remotion)
        if: ${{ inputs.mode == 'remotion' }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: studio/remotion-composer/package-lock.json

      - name: Install Remotion packages
        if: ${{ inputs.mode == 'remotion' }}
        working-directory: studio/remotion-composer
        run: npm ci --no-audit --no-fund

      - name: Set up Node.js 22 + HyperFrames Engine (when mode == hyperframes, real_sfx, or master)
        if: ${{ inputs.mode == 'hyperframes' || inputs.mode == 'real_sfx' || inputs.mode == 'master' }}
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install HyperFrames CLI & Ensure Browser
        if: ${{ inputs.mode == 'hyperframes' || inputs.mode == 'real_sfx' || inputs.mode == 'master' }}
        env:
          HYPERFRAMES_SKIP_SKILLS: "1"
          HYPERFRAMES_TELEMETRY_DISABLED: "1"
        run: |
          npm install -g hyperframes --no-audit --no-fund
          hyperframes browser ensure

      - name: Restore Style A source/song cache
        if: ${{ inputs.mode == 'stylea_plan' }}
        uses: actions/cache/restore@v4
        with:
          path: /tmp/maker_stylea_cache
          key: stylea-${{ inputs.cache_key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            stylea-${{ inputs.cache_key }}-

      - name: Restore Style 3 source/song cache
        if: ${{ inputs.mode == 'style3_maverick' }}
        uses: actions/cache/restore@v4
        with:
          path: /tmp/maker_style3_cache
          key: style3-${{ inputs.cache_key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            style3-${{ inputs.cache_key }}-

      - name: Execute no-video setup check or cloud render worker
        env:
          RENDER_MODE: ${{ inputs.mode }}
          JOB_B64: ${{ inputs.job_b64 }}
          MAKER_ASSET_CACHE: /tmp/maker_stylea_cache
          MAKER_STYLE3_CACHE: /tmp/maker_style3_cache
        run: |
          if [ "$RENDER_MODE" = "setup_check" ]; then
            python3 studio/cloud/setup_check.py --out-dir studio/cloud_out
          elif [ "$RENDER_MODE" = "style3_maverick" ]; then
            python3 studio/cloud/style3_worker.py --job-b64 "$JOB_B64" --out-dir studio/cloud_out
          else
            python3 studio/cloud/hq_worker.py --mode "$RENDER_MODE" --job-b64 "$JOB_B64" --out-dir studio/cloud_out
          fi

      - name: Save Style A source/song cache
        if: ${{ success() && inputs.mode == 'stylea_plan' }}
        uses: actions/cache/save@v4
        with:
          path: /tmp/maker_stylea_cache
          key: stylea-${{ inputs.cache_key }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save Style 3 source/song cache
        if: ${{ success() && inputs.mode == 'style3_maverick' }}
        uses: actions/cache/save@v4
        with:
          path: /tmp/maker_style3_cache
          key: style3-${{ inputs.cache_key }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload Rendered Video & QA Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maker-render-${{ github.run_id }}
          path: studio/cloud_out/*
          retention-days: 7
